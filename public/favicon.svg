<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#1c1b1d"/>
    </linearGradient>

    <!-- Border & Accent Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00daf3"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGradient)"/>

  <!-- Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="url(#brandGradient)" stroke-width="16" opacity="0.9"/>

  <!-- Code Bracket Symbols & Monogram SA -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 120 190 L 60 256 L 120 322" stroke="url(#brandGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Right Slash / -->
    <path d="M 430 190 L 370 322" stroke="#7000ff" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- "S" Path -->
    <path d="M 235 210 C 235 185, 175 185, 175 220 C 175 260, 235 250, 235 292 C 235 330, 170 330, 170 302" stroke="url(#brandGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- "A" Path -->
    <path d="M 270 320 L 315 192 L 360 320 M 283 282 L 347 282" stroke="url(#brandGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
